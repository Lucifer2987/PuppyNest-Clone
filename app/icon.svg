<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <!-- Outer cream circle with thick warm brown border (matches LogoBadge) -->
  <circle cx="64" cy="64" r="58.5" fill="#FFF8EA" stroke="#9A4F28" stroke-width="11" />

  <!-- Inner badge artwork scaled to match LogoBadge proportions -->
  <g transform="translate(16, 16) scale(0.96)">
    <!-- Outer dashed circular accent -->
    <circle
      cx="50"
      cy="50"
      r="46"
      stroke="#C98B4D"
      stroke-width="1.4"
      stroke-dasharray="2.5 2.5"
    />

    <!-- Inner solid border -->
    <circle cx="50" cy="50" r="41" stroke="#2A1A12" stroke-width="2" fill="#FFF8EA" />

    <!-- Cute poodle mascot face with top-knot and cream muzzle -->
    <g transform="translate(18, 16)">
      <!-- Top-Knot Pom-Pom -->
      <circle cx="32" cy="11" r="7.5" fill="#E9B965" stroke="#2A1A12" stroke-width="2" />
      <circle cx="28" cy="12" r="4.5" fill="#E9B965" stroke="#2A1A12" stroke-width="1.5" />
      <circle cx="36" cy="12" r="4.5" fill="#E9B965" stroke="#2A1A12" stroke-width="1.5" />

      <!-- Fluffy scalloped ears -->
      <circle cx="10" cy="28" r="7.5" fill="#E9B965" stroke="#2A1A12" stroke-width="2" />
      <circle cx="9" cy="38" r="6" fill="#E9B965" stroke="#2A1A12" stroke-width="2" />
      <circle cx="54" cy="28" r="7.5" fill="#E9B965" stroke="#2A1A12" stroke-width="2" />
      <circle cx="55" cy="38" r="6" fill="#E9B965" stroke="#2A1A12" stroke-width="2" />

      <!-- Head Cloud Curls -->
      <circle cx="18" cy="21" r="6.5" fill="#E9B965" stroke="#2A1A12" stroke-width="1.8" />
      <circle cx="46" cy="21" r="6.5" fill="#E9B965" stroke="#2A1A12" stroke-width="1.8" />

      <!-- Head Base -->
      <circle cx="32" cy="30" r="18" fill="#E9B965" stroke="#2A1A12" stroke-width="2.2" />

      <!-- Blush -->
      <circle cx="20" cy="34" r="3.5" fill="#F2A7A0" opacity="0.9" />
      <circle cx="44" cy="34" r="3.5" fill="#F2A7A0" opacity="0.9" />

      <!-- Cream Muzzle -->
      <ellipse cx="32" cy="36" rx="9" ry="6.5" fill="#F6DDA6" stroke="#2A1A12" stroke-width="1.8" />

      <!-- Eyes with Twinkles -->
      <circle cx="25" cy="29" r="3.2" fill="#2A1A12" />
      <circle cx="24" cy="28" r="1.2" fill="#FFFFFF" />

      <circle cx="39" cy="29" r="3.2" fill="#2A1A12" />
      <circle cx="38" cy="28" r="1.2" fill="#FFFFFF" />

      <!-- Nose & Smile -->
      <ellipse cx="32" cy="34" rx="2" ry="1.4" fill="#2A1A12" />
      <path
        d="M29.5 37C30.5 38.5 33.5 38.5 34.5 37"
        stroke="#2A1A12"
        stroke-width="1.6"
        stroke-linecap="round"
      />
    </g>

    <!-- Tiny star accent -->
    <path
      d="M50 82L51 85L54 85L51.5 87L52.5 90L50 88L47.5 90L48.5 87L46 85L49 85Z"
      fill="#9A4F28"
    />
  </g>
</svg>
